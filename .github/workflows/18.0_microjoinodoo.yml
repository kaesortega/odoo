# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - microjoinOdoo

on:
  push:
    branches:
      - 18.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          
      - name: Install ldap
        run: sudo apt install -y libldap2-dev libsasl2-dev python3-dev build-essential
        
      - name: Install dependencias-previas
        run: pip install setuptools wheel
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      name: 'Production'
      #url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
      AZURE_WEBAPP_NAME: MicrojoinOdoo     # set this to your application's name
      WORKING_DIRECTORY: '.'        # set this to the path to your path of working directory inside github repository, defaults to the repository root
      PYTHON_VERSION: '3.12'        # set the version to use
      STARTUP_COMMAND: 'python odoo-bin -r ${{ secrets.DB_USER }} -w ${{ secrets.DB_PASSWORD }} --addons-path=addons -d mydb --db_host=${{ secrets.DB_HOST}}'           # set this to the startup command required to start the gunicorn server. default it is empty

    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Install ldap
        run: sudo apt install -y libldap2-dev libsasl2-dev python3-dev build-essential
        
      - name: Install dependencias-previas
        run: pip install setuptools wheel

      
      #- name: 'Deploy to Azure Web App'
      #  uses: azure/webapps-deploy@v4
      #  id: deploy-to-webapp
      #  with:
      #    app-name: 'microjoinOdoo'
      #    slot-name: 'Production'
      #    publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F326FE0769364520A20CCA95A8FA1486 }}
        #env:
        #  AZURE_WEBAPP_NAME: 'microjoinOdoo'     # set this to your application's name
        #  WORKING_DIRECTORY: '.'        # set this to the path to your path of working directory inside github repository, defaults to the repository root
        #  PYTHON_VERSION: '3.12'
        #  STARTUP_COMMAND: 'python odoo-bin -r ${{ secrets.DB_USER }} -w ${{ secrets.DB_PASSWORD }} --addons-path=addons -d mydb --db_host=${{ secrets.DB_HOST}}'

        # Azure login
      - uses: azure/login@v1
        with:
         creds: ${{ secrets.AZURE_CREDENTIALS_GITHUB_SECRET }}
      - uses: azure/appservice-settings@v1
        with:
         app-name: ${{ env.AZURE_WEBAPP_NAME }}
         mask-inputs: false
         general-settings-json: '{"linuxFxVersion": "PYTHON|${{ env.PYTHON_VERSION }}"}' #'General configuration settings as Key Value pairs'
        # deploy web app
      - uses: azure/webapps-deploy@v2
        with:
         app-name: ${{ env.AZURE_WEBAPP_NAME }}
         package: ${{ env.WORKING_DIRECTORY }}
         startup-command: ${{ env.STARTUP_COMMAND }}
      # Azure logout
      - name: logout
        run: |
         az logout

